<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Arial, sans-serif">
  <style>
    .box { fill:#eef2ff; stroke:#1a2a6c; stroke-width:2; rx:8; }
    .box2 { fill:#fff7ed; stroke:#c2410c; stroke-width:2; rx:8; }
    .box3 { fill:#f0fdf4; stroke:#166534; stroke-width:2; rx:8; }
    .lbl { font-size:13px; fill:#111; }
    .title { font-size:16px; font-weight:bold; fill:#1a2a6c; }
    .arrow { stroke:#333; stroke-width:1.5; marker-end:url(#arrow); fill:none; }
    .small { font-size:11px; fill:#555; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>

  <text x="20" y="30" class="title">AI Knowledge Assistant — Architecture</text>

  <text x="20" y="65" class="title" font-size="14">Document Ingestion</text>
  <rect x="20" y="80" width="150" height="50" class="box"/>
  <text x="35" y="110" class="lbl">PDF Upload</text>

  <rect x="210" y="80" width="150" height="50" class="box"/>
  <text x="225" y="102" class="lbl">Extract + Clean</text>
  <text x="225" y="118" class="small">pypdf, per-page</text>

  <rect x="400" y="80" width="150" height="50" class="box"/>
  <text x="415" y="102" class="lbl">Chunk</text>
  <text x="415" y="118" class="small">size=800, overlap=150</text>

  <rect x="590" y="80" width="150" height="50" class="box"/>
  <text x="605" y="102" class="lbl">Embed</text>
  <text x="605" y="118" class="small">all-MiniLM-L6-v2</text>

  <rect x="780" y="80" width="170" height="50" class="box"/>
  <text x="795" y="102" class="lbl">Store</text>
  <text x="795" y="118" class="small">ChromaDB (persistent)</text>

  <path class="arrow" d="M170,105 H210"/>
  <path class="arrow" d="M360,105 H400"/>
  <path class="arrow" d="M550,105 H590"/>
  <path class="arrow" d="M740,105 H780"/>

  <text x="20" y="190" class="title" font-size="14">Query / Chat Flow</text>

  <rect x="20" y="210" width="150" height="50" class="box"/>
  <text x="35" y="240" class="lbl">User Question</text>

  <rect x="210" y="210" width="150" height="50" class="box"/>
  <text x="225" y="232" class="lbl">Embed Query</text>
  <text x="225" y="248" class="small">same model</text>

  <rect x="400" y="210" width="170" height="50" class="box"/>
  <text x="415" y="232" class="lbl">Similarity Search</text>
  <text x="415" y="248" class="small">ChromaDB top_k=4</text>

  <path class="arrow" d="M170,235 H210"/>
  <path class="arrow" d="M360,235 H400"/>

  <rect x="400" y="300" width="170" height="70" class="box2"/>
  <text x="415" y="322" class="lbl">Score Filter</text>
  <text x="415" y="338" class="small">MIN_SCORE=0.15</text>
  <text x="415" y="352" class="small">RELATIVE_CUTOFF=0.7</text>

  <path class="arrow" d="M485,260 V300"/>

  <rect x="230" y="300" width="150" height="70" class="box2"/>
  <text x="245" y="325" class="lbl">No chunks pass</text>
  <text x="245" y="341" class="lbl">filter?</text>
  <text x="245" y="357" class="small">→ "not found" reply</text>
  <path class="arrow" d="M400,325 H380"/>

  <rect x="620" y="300" width="170" height="70" class="box3"/>
  <text x="635" y="325" class="lbl">LLM (Ollama)</text>
  <text x="635" y="341" class="small">llama3.2:3b</text>
  <text x="635" y="357" class="small">context + question</text>
  <path class="arrow" d="M570,335 H620"/>

  <rect x="620" y="410" width="170" height="60" class="box"/>
  <text x="635" y="435" class="lbl">Grounded Answer</text>
  <text x="635" y="451" class="small">+ source citations</text>
  <path class="arrow" d="M705,370 V410"/>

  <text x="20" y="530" class="title" font-size="14">FastAPI Endpoints</text>
  <rect x="20" y="550" width="900" height="80" class="box" rx="8"/>
  <text x="40" y="578" class="lbl">POST /documents/upload   POST /documents/process   POST /chat   GET /documents   GET /health</text>
  <text x="40" y="600" class="small">Logging: query, retrieval time, LLM time, total latency — all requests validated with Pydantic schemas</text>

  <text x="20" y="660" class="title" font-size="14">Deployment</text>
  <text x="20" y="685" class="lbl">Docker container (FastAPI + ChromaDB) → reaches Ollama on host via host.docker.internal:11434</text>
</svg>
